
services:

  mongo:
    image: mongo:${MONGO_VERSION:-8.2}
    # the bind_ip option is requried from MONGO Version 3.6, alternatively you can use --bind_ip_all
    user: mongodb
    entrypoint:
      - "/usr/bin/mongod"
      - "--replSet"
      - "${REPLICASET_NAME:-rs}"
      #- "--journal"      # Deprecated since MONGO_VERSION==6.1
      #- "--smallfiles"   # Deprecated since MONGO_VERSION==4.0
      - "--bind_ip"
      - "0.0.0.0"
    # ports:
    #   - "${MONGO_PORT:-27017}:27017"
    # The usage of volume provides persistence, but may work correctly only with 1 volume per node (that's why global mode is recommended)
    volumes:
      - mongoconfigdb:/data/configdb
      - mongodata:/data/db
    networks:
      - backend
    configs:
    # to avoid changes to the original mongo image, we import the healthcheck script using configs
      - source: mongo-healthcheck
        target: /mongo-healthcheck
        mode: 0755
    # it simply checks that the client can connect to mongo. No test is run w.r.t. the cluster.
    healthcheck:
        test: ["CMD", "bash", "/mongo-healthcheck"]
        interval: ${HEALTHCHECK_INTERVAL:-60}s
        start_period: ${START_PERIOD_SECONDS:-60}s
        start_interval: ${START_INTERVAL_SECONDS:-5}s
        timeout: ${HEALTHCHECK_TIMEOUT:-10}s
        retries: 3
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: ${RESTART_DELAY:-20}s

  controller:
    image: martel/mongo-replica-ctrl:${CONTROLLER_TAG:-dev}
    volumes:
      # TODO: Avoid exposing the docker socket (security issue)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OVERLAY_NETWORK_NAME: ${BACKEND_NETWORK_NAME:-backend}
      MONGO_SERVICE_NAME: ${STACK_NAME:-mongo}_mongo
      REPLICASET_NAME: ${REPLICASET_NAME:-rs}
      #DEBUG: 1 #uncomment to debug the script
    entrypoint: python /src/replica_ctrl.py
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role==manager]
      restart_policy:
        condition: on-failure

configs:
  # to avoid changes to the original mongo image, we import the healthcheck script using configs
  mongo-healthcheck:
    file: mongo-healthcheck

volumes:
  # External true ensures that the volume is not re-created if already present
  mongoconfigdb:
    external: true
  mongodata:
    external: true

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK_NAME:-backend}
